<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pilgrim Trail - An 8-bit style resource management survival game">
    <title>Pilgrim Trail</title>
    <style>
        /* Reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: monospace;
        }

        /* Canvas styling */
        #gameCanvas {
            /* Crisp pixel rendering for 8-bit aesthetics */
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            
            /* Subtle retro CRT glow effect */
            box-shadow: 
                0 0 20px rgba(0, 100, 150, 0.3),
                0 0 60px rgba(0, 50, 100, 0.2);
            
            /* Slight border for definition */
            border: 4px solid #1D2B53;
        }

        /* Scanline overlay (optional - can be removed for performance) */
        #gameCanvas::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <!-- Load renderer first (no dependencies) -->
    <script src="renderer.js"></script>
    <!-- Load game logic (depends on renderer for display) -->
    <script src="game.js"></script>
</body>
</html>
